<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Ethan hair comparison</title>
  <style>
    body{margin:0;min-width:360px;background:#141b24;color:#f4f6fa;font:14px system-ui}
    main{width:360px;margin:auto}
    #stage{position:relative;width:360px;height:520px;background:#141b24}
    #stage.light{background:#d8dce2}
    canvas{display:block;width:100%;height:100%;background:transparent}
    #loading{position:absolute;top:12px;left:12px;color:white;background:#182334b8;padding:8px;border-radius:8px;font:14px system-ui}
    #enable-audio{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);padding:12px 18px;border:0;border-radius:24px;background:#20304e;color:white;cursor:pointer}
    [hidden]{display:none!important}
    #controls{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0;align-items:center}
    select,button{font:inherit;padding:5px}
    #sample-status,#results{margin:0 0 8px;overflow-wrap:anywhere}
    #results{white-space:pre-wrap;font:12px ui-monospace,monospace}
  </style>
</head>
<body>
  <main>
    <div id="stage">
      <canvas id="unity-canvas" tabindex="-1" aria-label="Talking character"></canvas>
      <div id="loading" role="status">Loading character…</div>
      <button id="enable-audio" type="button">Tap to enable voice</button>
    </div>
    <div id="controls">
      <label>Hair <select id="hair" disabled>
        <option value="Cards">Groom-baked cards</option>
        <option value="Ribbons">Current ribbons</option>
        <option value="Hidden">Scalp hair hidden</option>
      </select></label>
      <label>Pixel ratio cap <select id="pixel-ratio"><option>2</option><option>1.5</option></select></label>
      <label><input id="background" type="checkbox"> Light background</label>
      <button id="sample" type="button" disabled>Run three samples</button>
      <button id="download" type="button" disabled>Download results</button>
    </div>
    <p id="sample-status" role="status">Enable voice and wait for Ethan’s greeting.</p>
    <pre id="results"></pre>
  </main>
  <script src="alpha-canvas.js?v=20261124-mobile1"></script>
  <script src="bridge-config.js"></script>
  <script src="bridge.js"></script>
  <script src="comparison.js"></script>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const loading = document.getElementById('loading');
    const config = {
      dataUrl: 'Build/{{{ DATA_FILENAME }}}',
      frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl: 'Build/{{{ CODE_FILENAME }}}',
#if MEMORY_FILENAME
      memoryUrl: 'Build/{{{ MEMORY_FILENAME }}}',
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: 'Build/{{{ SYMBOLS_FILENAME }}}',
#endif
      streamingAssetsUrl: 'StreamingAssets',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, window.EthanHairTest.cap),
      webglContextAttributes: { alpha: true, premultipliedAlpha: false },
      showBanner: (message, type) => { if (type === 'error') { loading.hidden = false; loading.textContent = message; } }
    };
    const loader = document.createElement('script');
    loader.src = 'Build/{{{ LOADER_FILENAME }}}';
    loader.onload = () => createUnityInstance(canvas, config, progress => {
      loading.textContent = 'Loading character… ' + Math.round(progress * 100) + '%';
    }).then(instance => {
      window.TalkDemoTransport.attach(instance);
      window.EthanHairTest.attach(instance);
      loading.hidden = true;
    })
      .catch(error => { loading.textContent = 'Could not load character: ' + error; });
    loader.onerror = () => { loading.textContent = 'Unity build files could not be loaded.'; };
    document.body.appendChild(loader);
  </script>
</body>
</html>
