<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Talk Demo iframe test</title>
<style>
body{margin:0;padding:24px;font:16px system-ui;background:#f4f1ed;color:#243047}main{max-width:880px;margin:auto}
.stage{position:relative;height:460px;border-radius:24px;overflow:hidden;background:linear-gradient(135deg,#344c56,#c6b6a2 55%,#59453c)}
.stage::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 110px,#ffffff38 110px 114px);pointer-events:none}
iframe{position:relative;border:0;width:100%;height:100%;background:transparent}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
input,button,select,textarea{font:inherit;padding:8px;border:1px solid #aeb6c0;border-radius:8px}input[type=url]{flex:1;min-width:240px}
textarea{box-sizing:border-box;width:100%;height:160px}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:180px;overflow:auto;background:#e4e7eb;padding:12px}
button{cursor:pointer}label{display:block;margin-top:12px}p{line-height:1.5}
@media(max-width:520px){body{padding:12px}.stage{height:400px}}
</style></head>
<body><main>
<h1>Talk Demo</h1>
<p>The background and controls belong to this page. The character runs inside the transparent iframe. Tap “enable voice” inside the character panel before sending speech.</p>
<div class="toolbar"><input id="build-url" type="url" aria-label="Unity build URL" value="../Builds/TalkDemo/index.html"><button id="load">Load character</button></div>
<div class="stage" id="stage"><iframe id="character" title="Character preview" allow="autoplay; fullscreen"></iframe></div>
<div class="toolbar"><select id="persona" aria-label="Persona"><option value="Ethan Reeve">Ethan Reeve</option><option value="Liora Minji">Liora Minji</option></select><button id="select" disabled>Select persona</button><button id="stop" disabled>Stop and clear</button><button id="background">Change background</button></div>
<label for="file">Load a JSON payload in memory</label><input type="file" id="file" accept=".json,.txt,application/json,text/plain">
<label for="payload">Or paste the complete speech JSON</label><textarea id="payload" spellcheck="false"></textarea>
<div class="toolbar"><button id="send" disabled>Send speech payload</button></div>
<p id="status" role="status">Load a Unity Web build to begin. This page does not build Unity.</p><pre id="events" aria-label="Bridge events"></pre>
<script src="host.js"></script></main></body></html>
